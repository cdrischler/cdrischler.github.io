<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk locations</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="leaflet_dist/leaflet.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css">
  <script src="leaflet_dist/leaflet.js"></script>
  <script src="leaflet_dist/leaflet.markercluster.js"></script>
  <script src="org-locations.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Leaflet 1.9.4 and Leaflet.markercluster 1.5.3 are bundled in leaflet_dist/.
    // Talk locations come from org-locations.js (generated by talkmap.ipynb from talk_location_data.txt).
    var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
    });

    var map = L.map('map', {
      center: L.latLng(30, 10),
      zoom: 2,
      layers: [tiles],
      scrollWheelZoom: false // let the page scroll past the embedded map; use +/- or pinch to zoom
    });

    var markers = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 80
    });

    for (var i = 0; i < addressPoints.length; i++) {
      var a = addressPoints[i];
      var marker = L.marker(L.latLng(a[1], a[2]), { title: a[0] });
      marker.bindPopup(a[0]);
      markers.addLayer(marker);
    }
    map.addLayer(markers);
  </script>
</body>
</html>
